spring.application.name=shop
inventory.url=http://localhost:8081

# Fixwire: the DSN falls back to FIXWIRE_DSN; without one the SDK does nothing.
fixwire.release=shop@1.0.0
fixwire.traces-sample-rate=1.0
# Trace headers go to our own inventory service, nowhere else.
fixwire.trace-propagation-targets=${inventory.url}
